name: LLM Quality Assurance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Automated QA & Security Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic QA & Security Test Suite (Zero API Keys Required)
        env:
          USE_MOCK_LLM: "true"
        run: |
          pytest -v --junitxml=reports/junit_report.xml

      - name: Upload Test Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-reports
          path: reports/
